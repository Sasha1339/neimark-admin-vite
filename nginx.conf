events {
    worker_connections     1024;
}

http {
    include /etc/nginx/mime.types;

    sendfile on;

    index index.html;

    client_max_body_size 20M;

    server {
        listen 80;
        listen [::]:80;

        server_name localhost;

        root /usr/share/nginx/html;
        gzip_static on;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /v1/ {
            # 1. Проксируем на HTTPS Appwrite
                proxy_pass https://cloud.appwrite.io/v1/;

                # 2. КРИТИЧЕСКИ ВАЖНЫЕ ЗАГОЛОВКИ:
                #    Передаем правильное имя хоста для SSL (SNI) и HTTP
                proxy_set_header Host cloud.appwrite.io;
                #    Передаем реальный IP клиента
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                # 3. КРИТИЧЕСКИ ВАЖНЫЕ НАСТРОЙКИ SSL:
                #    Включаем передачу SNI для корректного TLS-рукопожатия
                proxy_ssl_server_name on;
                #    Указываем конкретное имя для SNI
                proxy_ssl_name cloud.appwrite.io;

                 # 4. Убираем Origin от клиента, чтобы избежать CORS на стороне Appwrite
                 proxy_set_header Origin $http_origin;

                # 5. CORS-заголовки для вашего браузера (остаются)
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "X-Appwrite-Project, Content-Type, Authorization, Origin, Accept" always;
        }
    }

}