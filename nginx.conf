events {
    worker_connections     1024;
}

http {
    include /etc/nginx/mime.types;

    sendfile on;

    index index.html;

    client_max_body_size 20M;

    server {
        listen 80;
        listen [::]:80;

        server_name localhost;

        root /usr/share/nginx/html;
        gzip_static on;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ^~ /v1/databases {
            # 1. Проксируем на HTTPS Appwrite
            proxy_pass https://cloud.appwrite.io;

            # 2. КРИТИЧЕСКИ ВАЖНЫЕ ЗАГОЛОВКИ:
            #    Передаем правильное имя хоста для SSL (SNI) и HTTP
            proxy_set_header Host cloud.appwrite.io;
            #    Передаем реальный IP клиента
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 3. КРИТИЧЕСКИ ВАЖНЫЕ НАСТРОЙКИ SSL:
            #    Включаем передачу SNI для корректного TLS-рукопожатия
            proxy_ssl_server_name on;
            #    Указываем конкретное имя для SNI
            proxy_ssl_name cloud.appwrite.io;

            # 5. CORS-заголовки для вашего браузера (остаются)
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "X-Appwrite-Project, Content-Type, Authorization, Origin, Accept" always;
        }

        location ^~ /v1/account {
            proxy_pass https://cloud.appwrite.io;

            proxy_set_header Host cloud.appwrite.io;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_ssl_server_name on;
            proxy_ssl_name cloud.appwrite.io;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "X-Appwrite-Project, Content-Type, Authorization, Origin, Accept" always;
        }

        location ^~ /v1/storage {
            proxy_pass https://fra.cloud.appwrite.io;

            # Специальные настройки для multipart/form-data
                client_max_body_size 50M;

                    # КРИТИЧЕСКИ ВАЖНО: явно указываем HTTP/1.1
                    proxy_http_version 1.1;

                # Отключаем буферизацию для upload
                proxy_request_buffering off;
                proxy_buffering off;

                # Увеличиваем timeout
                proxy_read_timeout 300s;
                proxy_connect_timeout 300s;

            proxy_set_header Host fra.cloud.appwrite.io;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ОЧЕНЬ ВАЖНО: сохраняем boundary
                proxy_set_header Content-Type $content_type;

            proxy_ssl_server_name on;
            proxy_ssl_name fra.cloud.appwrite.io;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "X-Appwrite-Project, Content-Type, Authorization, Origin, Accept" always;
        }

    }

}