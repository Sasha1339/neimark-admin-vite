events {
    worker_connections     1024;
}

http {
    include /etc/nginx/mime.types;

    sendfile on;

    index index.html;

    client_max_body_size 20M;

    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name sasha1339-neimark-admin-vite-5dbf.twc1.net;

        root /usr/share/nginx/html;
        gzip_static on;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /v1/ {
            proxy_pass https://cloud.appwrite.io/v1/;

            # КРИТИЧЕСКИ ВАЖНО: Устанавливаем правильный Host
            proxy_set_header Host cloud.appwrite.io;

            # Удаляем Origin от клиента
            proxy_set_header Origin "";

            # Передаем другие заголовки
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;

            # Передаем Appwrite заголовки
            proxy_set_header X-Appwrite-Project $http_x_appwrite_project;

            # CORS для браузера
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "X-Appwrite-Project, Content-Type, Authorization, Origin, Accept" always;

            # Обработка preflight запросов
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Max-Age 1728000;
                add_header Content-Type 'text/plain charset=UTF-8';
                add_header Content-Length 0;
                return 204;
            }
        }
    }

}