events {
    worker_connections     1024;
}

http {
    include /etc/nginx/mime.types;

    sendfile on;

    index index.html;

    client_max_body_size 20M;

    server {
        listen 80;
        listen [::]:80;

        server_name localhost;

        root /usr/share/nginx/html;
        gzip_static on;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ^~ /v1/storage {
            proxy_pass https://fra.cloud.appwrite.io;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Host fra.cloud.appwrite.io;
            add_header Access-Control-Allow-Origin *;
        }

        location ^~ /v1/databases {
            proxy_pass https://cloud.appwrite.io;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Host cloud.appwrite.io;
            add_header Access-Control-Allow-Origin *;
        }

        location ^~ /v1/account {
            proxy_pass https://cloud.appwrite.io;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Host cloud.appwrite.io;

            proxy_cookie_domain cloud.appwrite.io admin.neimark.ukmira.ru;
            proxy_cookie_path / /;

            add_header Access-Control-Allow-Origin *;
        }
    }

}